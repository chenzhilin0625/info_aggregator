# === DeepSeek API 配置 ===
deepseek:
  # *** 必填：DeepSeek API Key（https://platform.deepseek.com/api_keys）
  api_key: "sk-8171f7606bf74596bd7ad84d6d11353a"
  # 基础 URL（通常无需修改）
  base_url: "https://api.deepseek.com"
  # 第一阶段分类（批量，低成本）- deepseek-chat 足够
  classify_model: "deepseek-chat"
  # 第二阶段提取（单条）
  extract_model: "deepseek-chat"
  # 第三阶段综合分析（需要推理能力）- deepseek-chat 或 deepseek-reasoner
  synthesize_model: "deepseek-chat"
  # 每日费用熔断（USD），超出则跳过综合分析
  daily_cost_limit_usd: 0.50
  # 每批分类的内容数量（建议20-30）
  classify_batch_size: 25

